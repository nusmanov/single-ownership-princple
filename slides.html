section.cover p { font-size: 22px; }
section.photo { justify-content: center; }

.subtitle { font-size: 22px; color: #666; margin-top: -18px; margin-bottom: 22px; }

<h1 id="a-necessary-check-before-splitting">A necessary check before splitting</h1>
<ul>
<li><code>save</code> and <code>findById</code> do <strong>not</strong> belong together merely because both access a database.</li>
<li>Ask whether one storage policy really drives changes to both methods.</li>
<li>Check whether DBA and Operations / BI specify behavior, or only help implement it.</li>
<li>Check dependencies after the split: a change to shared <code>Student</code> may still affect the other classes.</li>
</ul>
<p>The actor map is a <strong>hypothesis to verify</strong>, not proof from the method names.</p>

<h1 id="take-away">Take away</h1>
<ul>
<li>The number of methods does not determine the number of responsibilities.</li>
<li><strong>SRP:</strong> Does the class have one reason to change?</li>
<li><strong>SOP:</strong> Does it serve one owner of that responsibility?</li>
<li>Count narrowly defined requirement sources, not broad platform teams. Then both identify the same boundary.</li>
</ul>
